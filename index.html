<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Karaoke Party System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- Generador QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- API de YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); }
    
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(0.6); }
      20% { opacity: 0.9; transform: translateY(-40px) scale(1.15); }
      80% { opacity: 0.7; }
      100% { opacity: 0; transform: translateY(-280px) scale(0.9); }
    }
    .reaction-bubble {
      position: absolute;
      bottom: 60px;
      animation: floatUp 3.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-amber-500 selection:text-black">

  <!-- ================= 1. INICIO: CREACIÓN DE SALA ================= -->
  <div id="view-create-room" class="min-h-screen flex items-center justify-center p-6">
    <div class="glass border border-white/10 p-8 rounded-3xl max-w-md w-full text-center space-y-6 shadow-2xl">
      <div>
        <h1 class="text-4xl font-black text-amber-400 tracking-tight">🎤 KARAOKE LIVE</h1>
        <p class="text-slate-400 text-sm mt-1">Configuración de Pantalla Principal</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Nombre o Código de la Sala</label>
          <input id="input-room-name" type="text" placeholder="Ej: FIESTA, CUMPLE..." class="w-full text-center font-mono uppercase text-xl font-bold py-3 bg-slate-900 border border-slate-700 rounded-xl text-amber-400 focus:outline-none focus:border-amber-400">
        </div>
        <button onclick="createAndStartRoom()" class="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-xl transition shadow-lg shadow-amber-500/20">
          Iniciar Sala en Pantalla
        </button>
      </div>
    </div>
  </div>

  <!-- ================= 2. PANTALLA DE EMPAREJAMIENTO DJ ================= -->
  <div id="view-dj-setup" class="hidden min-h-screen flex flex-col items-center justify-center p-6 text-center space-y-6">
    <div>
      <span class="text-xs uppercase tracking-widest text-emerald-400 font-bold bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">Sala Creada</span>
      <h2 id="setup-room-code" class="text-6xl font-black text-amber-400 tracking-widest my-3">----</h2>
      <p class="text-slate-300 text-lg">Escanea este código con tu celular para tomar el <strong>Mando de DJ</strong></p>
    </div>

    <div class="glass p-6 rounded-3xl border border-white/10 shadow-2xl">
      <div id="dj-qrcode" class="flex justify-center bg-white p-4 rounded-2xl mx-auto w-fit"></div>
      <p id="dj-debug-url" class="text-[10px] text-slate-500 font-mono mt-3 max-w-xs break-all">--</p>
    </div>

    <button onclick="skipToMainScreen()" class="px-6 py-2 bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-white text-xs font-semibold rounded-lg border border-slate-800 transition">
      Pasar a pantalla completa sin DJ ahora ➔
    </button>
  </div>

  <!-- ================= 3. VISTA: PANTALLA / PROYECTOR PRINCIPAL ================= -->
  <div id="view-screen" class="hidden h-screen w-screen relative overflow-hidden bg-black flex flex-col">
    <div id="player-container" class="w-full h-full pointer-events-none">
      <div id="yt-player" class="w-full h-full"></div>
    </div>

    <!-- Contenedor reacciones flotantes -->
    <div id="reactions-container" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>

    <!-- HUD superior sin franjas oscuras -->
    <div class="absolute top-5 left-5 right-5 flex justify-between items-start pointer-events-none z-10">
      <div class="bg-black/60 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-white/10 shadow-lg flex items-center gap-3 max-w-[55%]">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping flex-shrink-0"></span>
        <div class="truncate">
          <p class="text-[10px] uppercase tracking-widest text-emerald-400 font-bold leading-none">Cantando</p>
          <p id="hud-singer" class="text-lg font-black text-white leading-tight truncate">Esperando canciones...</p>
          <p id="hud-song-title" class="text-xs text-slate-300 truncate font-medium">--</p>
        </div>
      </div>

      <div class="bg-black/60 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-white/10 shadow-lg text-right max-w-[40%]">
        <p class="text-[10px] uppercase tracking-widest text-amber-400 font-bold leading-none">Siguiente</p>
        <p id="hud-next" class="text-sm font-extrabold text-slate-200 leading-tight truncate">--</p>
        <p id="hud-room-code" class="text-[9px] font-mono text-slate-400 mt-0.5">SALA: ----</p>
      </div>
    </div>

    <!-- Transición de 5 Segundos -->
    <div id="transition-screen" class="hidden absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center text-center p-8 z-30">
      <div class="space-y-4 max-w-xl">
        <p class="text-amber-400 font-bold uppercase tracking-widest text-sm">Fin de la ronda</p>
        <h2 id="trans-last-singer" class="text-4xl font-extrabold text-white">¡Gran Show!</h2>
        
        <div class="flex justify
